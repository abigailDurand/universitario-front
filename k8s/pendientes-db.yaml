# PostgreSQL de uni-pendientes-api (BD de pendientes). Solo accesible dentro del clúster.
# Contraseña: Secret `pendientes-db` (clave `password`), creado a mano.
# Datos: PVC de 1Gi en la StorageClass `local-path` de K3s (disco del nodo EC2).
apiVersion: v1
kind: Service
metadata:
  name: uni-pendientes-db
  labels:
    app.kubernetes.io/name: uni-pendientes-db
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: uni-pendientes-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: uni-pendientes-db
  labels:
    app.kubernetes.io/name: uni-pendientes-db
spec:
  serviceName: uni-pendientes-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: uni-pendientes-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uni-pendientes-db
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: pendientes
            - name: POSTGRES_USER
              value: pendientes
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pendientes-db
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: datos
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "pendientes", "-d", "pendientes", "-h", "127.0.0.1"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "pendientes", "-d", "pendientes", "-h", "127.0.0.1"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
  volumeClaimTemplates:
    - metadata:
        name: datos
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi
