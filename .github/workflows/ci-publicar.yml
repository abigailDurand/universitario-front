# CI/CD de uni-panel.
# - Pull request hacia main: ./init.sh (lint + pruebas + build).
# - Push a main (merge): pruebas → imagen en GHCR → despliegue de uni-panel en K3s.
# Los pull requests solo ejecutan pruebas: nunca publican ni despliegan.
name: ci-publicar

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  IMAGEN: ghcr.io/abigaildurand/uni-panel

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      - name: Verificar (lint + pruebas + build)
        run: ./init.sh

  publicar:
    needs: pruebas
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.datos.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Etiqueta basada en el commit
        id: datos
        run: |
          tag="sha-${GITHUB_SHA::12}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "imagen=${IMAGEN}:${tag}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.datos.outputs.imagen }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Resumen
        env:
          IMAGEN_PUBLICADA: ${{ steps.datos.outputs.imagen }}
        run: |
          echo "Imagen publicada: \`${IMAGEN_PUBLICADA}\`" >> "$GITHUB_STEP_SUMMARY"

  desplegar:
    needs: publicar
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/desplegar.yml
    with:
      servicio: uni-panel
      tag: ${{ needs.publicar.outputs.tag }}
    secrets: inherit
