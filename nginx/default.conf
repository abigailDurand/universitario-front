# Nginx de uni-panel: sirve React y reenvía las API.
# proxy_pass sin URI final: se reenvía la ruta completa, sin quitar el prefijo
# (contratos: notas-service/SPEC.md y pendientes-service/SPEC.md).
# /api/auth y /api/notas -> uni-notas-api (5000); /api/pendientes -> uni-pendientes-api (3000);
# deben resolverse por DNS al arrancar Nginx (Kubernetes o red local de contenedores).
# /health de cada API no se publica.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Seguridad (docs/spec.md §9). El build de Vite no usa scripts ni estilos en línea.
    # Ningún location define add_header, así que todos heredan estas cabeceras.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # /api/auth y sus subrutas -> uni-notas-api (registro, login, me)
    location = /api/auth {
        proxy_pass http://uni-notas-api:5000;
        include /etc/nginx/conf.d/proxy-comun.inc;
    }
    location /api/auth/ {
        proxy_pass http://uni-notas-api:5000;
        include /etc/nginx/conf.d/proxy-comun.inc;
    }

    # /api/notas y sus subrutas -> uni-notas-api (Flask)
    location = /api/notas {
        proxy_pass http://uni-notas-api:5000;
        include /etc/nginx/conf.d/proxy-comun.inc;
    }
    location /api/notas/ {
        proxy_pass http://uni-notas-api:5000;
        include /etc/nginx/conf.d/proxy-comun.inc;
    }

    # /api/pendientes y sus subrutas -> uni-pendientes-api (Express)
    location = /api/pendientes {
        proxy_pass http://uni-pendientes-api:3000;
        include /etc/nginx/conf.d/proxy-comun.inc;
    }
    location /api/pendientes/ {
        proxy_pass http://uni-pendientes-api:3000;
        include /etc/nginx/conf.d/proxy-comun.inc;
    }

    # Cualquier otra ruta bajo /api no existe en el front.
    location /api/ {
        return 404;
    }

    # SPA: las rutas del front (/notas, /pendientes) devuelven index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
